<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>555 Auditor Portal</title>
<script>
/* Two kinds of visitor arrive at this page.

   On audit.mjmnursery.com (or any future custom domain) this repository IS
   the live 555 Auditor Portal, mirrored from mjm-ai-system/audit — go
   straight in, before anything renders, so the address bar stays on this
   domain.

   On mjmelon.github.io this is still the RETIRED old audit repo: phones
   that installed the old PWA from there hold its service worker and full
   offline cache, and must be torn down and sent to the portal copy. That
   path keeps the behaviour below. */
var LEGACY = /\.github\.io$/i.test(location.hostname);
if (!LEGACY) {
  location.replace('audit/audit_index.html' + location.search + location.hash);
}
</script>
<style>
  html,body{height:100%;margin:0}
  body{background:#1a4d1a;color:#fff;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px}
  .box{max-width:340px}
  h1{font-size:19px;font-weight:700;margin:0 0 10px}
  p{font-size:14px;line-height:1.6;opacity:.85;margin:0 0 22px}
  a{display:inline-block;background:#fff;color:#1a4d1a;text-decoration:none;font-weight:700;
    font-size:15px;padding:13px 26px;border-radius:10px}
  .spin{width:26px;height:26px;margin:0 auto 18px;border:3px solid rgba(255,255,255,.25);
        border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>Opening the 555 Auditor Portal</h1>
    <p>One moment&hellip;</p>
    <a id="go" href="audit/audit_index.html">Open 555 Auditor Portal</a>
  </div>

<script>
/* Legacy github.io path only: unregister the old PWA's service worker and
   delete its caches before leaving, or the cache keeps serving the retired
   app and this page is never seen again. On the audit domain this must NOT
   run — the live app's own service worker and offline cache live on that
   origin, and deleting them would wipe an auditor's offline copy. */
if (LEGACY) {
  var TARGET = 'https://audit.mjmnursery.com/audit/audit_home.html';
  document.getElementById('go').href = TARGET;

  var teardown = function () {
    var jobs = [];
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).catch(function () {}));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).catch(function () {}));
    }
    return Promise.all(jobs);
  };

  /* Never let the teardown strand anyone: leave after 2s whatever happens. */
  var left = false;
  var leave = function () { if (!left) { left = true; window.location.replace(TARGET); } };
  setTimeout(leave, 2000);
  teardown().then(leave);
}
</script>
</body>
</html>
