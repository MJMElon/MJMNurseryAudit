<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Moved</title>
<style>html,body{height:100%;margin:0}body{background:#1a4d1a;color:#fff;display:flex;align-items:center;
justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
text-align:center;padding:24px}a{color:#fff}</style>
</head>
<body>
<p>The audit app has moved.<br/><a id="go" href="https://ai.mjmnursery.com/audit/audit_maintenance_index.html">Open MJM Nursery Audit</a></p>
<script>
/* Retired page — see index.html. Clear the old PWA cache on the way out. */
var TARGET = 'https://ai.mjmnursery.com/audit/audit_maintenance_index.html';
document.getElementById('go').href = TARGET;
var left = false;
function leave() { if (!left) { left = true; window.location.replace(TARGET); } }
setTimeout(leave, 2000);
Promise.all([
  window.caches && caches.keys ? caches.keys().then(function (k) {
    return Promise.all(k.map(function (n) { return caches.delete(n); })); }).catch(function () {}) : null,
  navigator.serviceWorker && navigator.serviceWorker.getRegistrations
    ? navigator.serviceWorker.getRegistrations().then(function (r) {
        return Promise.all(r.map(function (x) { return x.unregister(); })); }).catch(function () {})
    : null
]).then(leave);
</script>
</body>
</html>
