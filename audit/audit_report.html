<script>
'use strict';

const PN_NURSERIES=['PN'];
const MN_NURSERIES=['BNN','UNN1','UNN2'];

function signOut(){
  if(!confirm('Sign out of the audit system?')) return;
  MJMAuditLogin.signOut();
}

let toastTimer=null;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}
function setLoading(on){document.getElementById('loading-overlay').classList.toggle('hidden',!on);}

// Starts empty — Nursery, Modules and Plot all start unset now (see the
// markup's own comment), so nothing is presumed picked until a report is
// actually generated. generateReport() is what enforces "at least one
// module" and "at least one nursery", not the tick itself — ticking or
// unticking any one of these is otherwise unconstrained.
const selectedMods=new Set();
// cb is the checkbox itself now (see the .tick-chip markup) — its own
// .checked is the state, not a class toggled by hand on the label.
function toggleMod(cb,mod){
  if(cb.checked) selectedMods.add(mod); else selectedMods.delete(mod);
  if(mod==='maint'){
    const row=document.getElementById('f-doneby-row');
    if(row) row.style.display=cb.checked?'':'none';
  }
}

/* WHO DID IT -- the third copy of this string.
   audit_home.html WRITES it on an admin closure and
   audit_maintenance_script.js colours it grey so a closed task does not
   read as the amber that means waiting. Change one, change all three, and
   never change the STRING: a row written before would keep the old
   wording and fall on the wrong side of this filter for ever. */
const MAINT_CLOSED_RESULT = 'Closed by admin';

/* The row decides, off the result it was SAVED with -- never off the
   auditor_name, which both kinds carry (the admin closure writes the
   admin who pressed the button, which is the point of it). */
function maintDoneBy(r){
  return (r && r.result === MAINT_CLOSED_RESULT) ? 'admin' : 'auditor';
}

/* Read off the DOM at generate time, the same way selectedAuditNurseries
   is, rather than kept in a Set that has to be held in step.
   NEITHER TICKED is every maintenance row dropped, and that is correct:
   somebody has unticked both on purpose, and the empty table says so
   under its own heading. */
function selectedDoneBy(){
  return [...document.querySelectorAll('.f-doneby-cb:checked')].map(cb=>cb.value);
}

function filterByDoneBy(rows,kinds){
  return (rows||[]).filter(r=>kinds.indexOf(maintDoneBy(r))!==-1);
}

// Nursery — Pre-Nursery / BNN / UNN 1 / UNN 2 — same tick-chip idea as
// Modules above, replacing the old three-way "both/pn/mn" select with one
// checkbox per nursery so any combination can be picked, not just the
// three the select happened to offer. Read straight off the DOM at
// generate time — no separate Set to keep in sync the way selectedMods
// needs one.
function selectedAuditNurseries(){
  return [...document.querySelectorAll('.f-nurs-cb:checked')].map(cb=>cb.value);
}

/* ── FILTERS FOLD AWAY ──
   On a phone the filter card is most of the first screenful, and once a
   report is on screen it is not what is being read. Collapsed
   automatically after the first successful generate on a narrow screen
   only — on a desk there is room for both. */
function setFilters(open){
  const card=document.getElementById('filter-card');
  const btn=document.getElementById('filter-toggle');
  card.classList.toggle('collapsed',!open);
  document.body.classList.toggle('is-collapsed',!open);
  btn.setAttribute('aria-expanded',String(open));
  document.getElementById('filter-toggle-label').textContent=open?'Hide':'Show';
}
function toggleFilters(){
  setFilters(document.getElementById('filter-card').classList.contains('collapsed'));
}

/* ── FULL SCREEN ──
   The class is what actually clears the page; the Fullscreen API is asked
   on top of it and is allowed to fail. Safari on iOS has no element
   fullscreen at all, and a report that only expands on Chrome would be a
   button that does nothing on half the devices this is opened on. */
function toggleFullScreen(){
  const on=!document.body.classList.contains('is-full');
  document.body.classList.toggle('is-full',on);
  const lbl=document.querySelector('#btn-full span');
  if(lbl) lbl.textContent=on?'Exit Full Screen':'Full Screen';
  try{
    if(on){ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }
    else{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }
  }catch(e){}
}
/* Leaving fullscreen by Esc or the browser's own control has to put the
   page back too, or the chrome stays hidden with no way to bring it back. */
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('is-full')){
    document.body.classList.remove('is-full');
    const lbl=document.querySelector('#btn-full span');
    if(lbl) lbl.textContent='Full Screen';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && document.body.classList.contains('is-full') && !document.fullscreenElement)
    toggleFullScreen();
});

/* LOCAL time, never toISOString(). toISOString() is the day before in
   Malaysia for the whole of the early morning, which on the 1st of a month
   opens the report on the wrong month -- the same trap `_localISO()` on the
   audit board already names. */
function _localISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
                        +'-'+String(d.getDate()).padStart(2,'0');
}

function initFilters(){
  /* The current month, first to last, so pressing Generate with nothing
     else touched draws the report this page has always drawn. The last day
     is used rather than today, because a month still running has no audits
     dated after today anyway and an auditor saving one this afternoon is
     then already inside the range. */
  const now=new Date();
  const first=new Date(now.getFullYear(),now.getMonth(),1);
  const last=new Date(now.getFullYear(),now.getMonth()+1,0);
  document.getElementById('f-from').value=_localISO(first);
  document.getElementById('f-to').value=_localISO(last);
}

function esc(v){
  return String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function fmtDate(iso){
  if(!iso)return'—';
  const s=iso.split('T')[0].split('-');
  return s[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+s[1]-1]+' '+s[0];
}

/* What the heading says the report covers. One day reads as one date --
   "05 Nov 2026 – 05 Nov 2026" is the same answer twice. */
function periodLabel(from,to){
  return from===to ? fmtDate(from) : fmtDate(from)+' – '+fmtDate(to);
}

async function fetchData(from,to){
  const df=`date=gte.${from}&date=lte.${to}`;
  const out={};
  const tasks=[];
  if(selectedMods.has('plot'))   tasks.push(sb.select('audit_plot_audits',   `select=audit_id,nursery,plot,batch,pest,tikus,disease,warna_daun,auditor_name,date&${df}`).then(r=>out.plot=r).catch(()=>out.plot=[]));
  /* Height by Batch is the same records read a different way, so it asks
     for them too -- and through the same slot, so the Plot search below
     narrows both or neither. */
  if(selectedMods.has('height')||selectedMods.has('bheight'))
                                 tasks.push(sb.select('audit_height_records', `select=record_id,nursery,plot,batch,sample_1,sample_2,sample_3,avg_height,auditor_name,date&${df}`).then(r=>out.height=r).catch(()=>out.height=[]));
  if(selectedMods.has('papan'))  tasks.push(sb.select('audit_papan_audits',   `select=audit_id,nursery,plot,batch_no,presence,info_correct,condition,auditor_name,date&${df}`).then(r=>out.papan=r).catch(()=>out.papan=[]));
  if(selectedMods.has('maint'))  tasks.push(sb.select('audit_maintenance_audits',`select=audit_id,task_id,nursery,plot,task_type,result,auditor_name,date&${df}`).then(r=>out.maint=r).catch(()=>out.maint=[]));
  await Promise.all(tasks);
  return out;
}

function filterByNursery(rows,nurseries){
  return(rows||[]).filter(r=>nurseries.includes(r.nursery));
}

// The Plot search box (#f-plot) — a case-insensitive substring match on
// each row's own plot field, every module table carries one. Empty query
// means no filter at all, same "nothing typed = show everything" rule the
// Nursery/Module ticks don't get (those default empty and mean "show
// nothing" until picked — a search box works the other way round).
function filterByPlot(rows,query){
  if(!query) return rows||[];
  const q=query.trim().toLowerCase();
  if(!q) return rows||[];
  return(rows||[]).filter(r=>String(r.plot||'').toLowerCase().includes(q));
}

/* ── ONE RECORD IS ONE VISIT, NOT ONE ROW ─────────────────────────────

   A table row is what the DATABASE holds, and on two of these modules that
   is finer than the thing the office counts:

   - **Plot Condition** in the main nursery is one row per plot per BATCH
     (audit_script.js says why: a plot holds several batches, each with its
     own age and its own audit). So one walk round B01 with seven batches
     standing in it is SEVEN rows, numbered 1 to 7, and the report said
     seven audits where somebody did one.
   - **Maintenance** is one row per CASE, and a case is one work record —
     so a plot sprayed by three workers on one morning is three cases and
     three audits. The office met exactly that and asked twice whether the
     report was counting one thing three times (it was not; they really are
     three cases, which is why the Case column exists).

   So a RECORD is the visit: the same plot on the same day, whatever the
   batch; the same plot and the same task on the same day, whatever the
   case. It is numbered once, counted once in every figure on the page, and
   drawn as ONE BLOCK with its identity merged down the side.

   **AND THE BATCHES AND CASES ARE STILL THERE, each on its own line** --
   that was the other half of what was asked, and it is also the only safe
   way to do this. A plot's readings are PER BATCH: a rat found on batch 253
   and nothing on 268 is the whole reason the alert board is per batch, so
   folding four readings into one cell could hide the one that matters. Each
   batch keeps its line and its own four readings; only the plot, the day
   and the record number are merged over them.

   The other two modules are untouched. Papan Tanda is one sign per plot and
   Seedling Height is measured plot by plot, so neither has a row the office
   reads as a repeat. */
function _recKey(v){
  return String(v==null?'':v).toUpperCase().replace(/[^A-Z0-9]/g,'');
}
function _recDay(r){
  return String((r&&r.date)||'').slice(0,10);
}
/* THE NURSERY IS IN THE KEY because a plot is a plot IN a nursery. The
   plot codes are disjoint in practice (P01-P52, B01-B14, U01-U18,
   N01-N20), so this moves nothing today -- but the Main Nursery section
   already draws BNN, UNN 1 and UNN 2 in ONE table, and the spreadsheet
   below puts every nursery in one sheet, so "the same plot" has to mean
   the same plot rather than the same spelling. */
const MOD_RECORD_KEY={
  plot:  r=>_recKey(r.nursery)+'|'+_recDay(r)+'|'+_recKey(r.plot),
  maint: r=>_recKey(r.nursery)+'|'+_recDay(r)+'|'+_recKey(r.plot)+'|'+_recKey(r.task_type)
};
/* What a continuation line is told to say on a PHONE, where the table folds
   into one card per row and a rowspan means nothing -- so the cards after
   the first would otherwise carry a batch and four readings with no plot
   and no date on them. */
const MOD_CONT_NOTE={
  plot:  'same plot · same day',
  maint: 'same plot · same task · same day'
};
/* The unit each module's figures are counted in, for the line under the
   table. A record is a visit; the lines under it are its batches or its
   cases. BOTH SPELLINGS, because `noun+'s'` reads "6 batchs" -- the kind
   of thing nobody notices in code and everybody notices on a printed
   sheet. */
const MOD_LINE_NOUN={ plot:['batch','batches'], maint:['case','cases'] };

/* HOW MANY RECORDS these rows are. Every figure on the page goes through
   this -- the summary card, the section total, the records badge and the
   table's own total -- for the reason the Done By filter already states in
   its own comment: one of them counted differently is one of them
   disagreeing with the rest. A module with no record key counts rows, which
   is what it always did. */
function recordCount(mod,rows){
  const keyOf=MOD_RECORD_KEY[mod];
  if(!keyOf) return (rows||[]).length;
  return new Set((rows||[]).map(keyOf)).size;
}

/* The ordinal of the RECORD a row belongs to, so the # column numbers
   visits and not lines.

   It reads off CONSECUTIVE runs, which the caller's sort is what makes --
   the same assumption `spans` in buildTable already makes, stated once and
   relied on by both. Memoised per array, because a column is asked once per
   row and walking the whole array each time would be quadratic on the
   eighteen hundred maintenance rows a month now carries. */
const _recNoCache=new WeakMap();
function _recNo(rows,i,keyOf){
  let m=_recNoCache.get(rows);
  if(!m||m.keyOf!==keyOf){
    const no=[]; let n=0, prev=null;
    rows.forEach((r,ix)=>{
      const k=keyOf(r);
      if(ix===0||k!==prev){ n++; prev=k; }
      no[ix]=n;
    });
    m={keyOf,no};
    _recNoCache.set(rows,m);
  }
  return m.no[i];
}

/* ── THE UNIT HEIGHTS ARE READ IN ─────────────────────────────────────
   The office asked for it over the Plot Avg column: *plot avg 我要可以
   选择cm or换算m*.

   IT IS EVERY HEIGHT ON THE SHEET, not the one column they were looking
   at. A row reading 141.7 · 161.1 · 120 · 1.417 is four centimetres and
   one metre side by side, which is a worse sheet than one with no choice
   on it at all; and there are TWO Plot Avg columns here — the Seedling
   Height table and the Height by Batch table — so moving one would be two
   answers on one page. The samples, both averages, the batch average and
   the four age cards all move together.

   A HEADING NAMES THE UNIT, which is what carries the choice onto PAPER:
   the control is in the toolbar and the toolbar does not print, so the
   heading is the only thing a printed sheet can say it with. That is why
   every figure that moves sits under a heading carrying `(cm)` or `(m)`.

   PRECISION DOES NOT MOVE. A reading is keyed to a tenth of a centimetre,
   which is a millimetre, and three decimals of a metre is the same
   millimetre — so 141.7 cm is 1.417 m and nothing is rounded away.
   Two decimals would have read 1.42 and thrown a measurement out.

   It is NOT remembered between page loads. This sheet gets printed and
   passed round, and a unit that is whatever somebody last picked on one
   machine is how two copies of one report come to disagree; the heading
   names it either way, so the predictable default is worth more. One line
   of localStorage the day the office asks. */
let _heightUnit='cm';
const HEIGHT_UNITS={ cm:{label:'cm',dp:1,per:1}, m:{label:'m',dp:3,per:100} };
const heightUnitLabel=()=>HEIGHT_UNITS[_heightUnit].label;
/* Appended to a heading, so there is one spelling of "(cm)" and the
   headings cannot come to disagree with the figures under them. */
const hgtHead=(name)=>name+' ('+heightUnitLabel()+')';

/* WHAT THE AUDITOR KEYED. In cm it is printed EXACTLY as it is stored —
   not re-rounded — so nothing whatever on this sheet moves until somebody
   picks metres. A value that is not a number is passed through as it is,
   because it is text somebody keyed and not a height to convert. */
function hgtKeyed(v){
  if(v===null||v===undefined||String(v).trim()==='') return '—';
  if(_heightUnit==='cm') return String(v);
  const n=Number(v);
  return Number.isFinite(n)?_hgtNum(n):String(v);
}
/* A figure this page WORKED OUT — a mean, which has as many decimals as
   the division left it, so it is rounded to the unit's own precision. */
function hgtMean(n){
  return (n==null||!Number.isFinite(Number(n)))?'—':_hgtNum(Number(n));
}
/* en-MY, pinned, for the reason the whole system pins it: unpinned, a
   handset set to a language that writes decimals with a comma prints a
   plot of 6,515 as 6.515. These are the lines this change touched. */
function _hgtNum(cm){
  const u=HEIGHT_UNITS[_heightUnit];
  return (cm/u.per).toLocaleString('en-MY',{maximumFractionDigits:u.dp});
}

/* A HEADING MAY BE A FUNCTION, because a height column does not know its
   own unit until somebody picks one -- see hgtHead. Asked at DRAW time by
   everything that draws, so the heading, the figures under it and the
   spreadsheet column come out of one choice in one pass and cannot
   disagree. `label` is the same heading one line down: what the cell
   announces itself as on a phone, where it is a card row and not a
   column. */
const colHead =c=>typeof c.h==='function'?c.h():c.h;
const colLabel=c=>typeof c.label==='function'?c.label():(c.label||colHead(c));

/* ── COLUMNS ──
   The four table shapes as data rather than as four hand-written blocks
   of HTML. Each column knows its own heading, and that heading is what
   goes into the cell's data-label — which is the whole of how a row
   folds into a readable card on a phone. Written out once, they cannot
   drift apart from the headings above them. */
const MOD_COLS={
  /* #, Date and Plot are the RECORD -- one walk round a plot on a day --
     and are drawn once over its batches. Everything from Batch rightwards
     is per batch, because that is what was audited. */
  plot:[
    {h:'#',       group:MOD_RECORD_KEY.plot,
                  v:(r,i,rows)=>_recNo(rows,i,MOD_RECORD_KEY.plot), label:'Record', num:true},
    {h:'Date',    group:MOD_RECORD_KEY.plot, v:r=>fmtDate(r.date), xlDate:r=>r.date},
    {h:'Plot',    group:MOD_RECORD_KEY.plot,
                  v:r=>`<b>${esc(r.plot)}</b>`,    raw:true},
    {h:'Batch',   v:r=>r.batch||'—'},
    {h:'Pest',    v:r=>r.pest||'—'},
    {h:'Animal',  v:r=>r.tikus||'—'},
    {h:'Disease', v:r=>r.disease||'—'},
    {h:'Leaf',    v:r=>r.warna_daun||'—'}
  ],
  height:[
    {h:'#',        v:(r,i)=>i+1, label:'Record', num:true},
    {h:'Date',     v:r=>fmtDate(r.date), xlDate:r=>r.date},
    {h:'Plot',     v:r=>`<b>${esc(r.plot)}</b>`,   raw:true},
    {h:'Batch',    v:r=>r.batch||'—'},
    /* THE HEADING IS A FUNCTION because the unit is chosen after the page
       loads -- see hgtHead. buildTable asks for it at draw time. */
    {h:()=>hgtHead('S1'),  v:r=>hgtKeyed(r.sample_1),  num:true},
    {h:()=>hgtHead('S2'),  v:r=>hgtKeyed(r.sample_2),  num:true},
    {h:()=>hgtHead('S3'),  v:r=>hgtKeyed(r.sample_3),  num:true},
    {h:()=>hgtHead('Avg'), v:r=>`<b>${esc(hgtKeyed(r.avg_height))}</b>`, raw:true, num:true},
    /* One cell for the whole group, not the same figure on every line --
       see `group` in buildModTable. */
    {h:()=>hgtHead('Plot Avg'), label:()=>'Plot average that day ('+heightUnitLabel()+')',
     group:r=>String(r.date||'')+'|'+String(r.plot||'').trim().toUpperCase(),
     v:(r,i,rows)=>`<b>${_heightPlotAvg(r,rows)}</b>`, raw:true, num:true}
  ],
  papan:[
    {h:'#',        v:(r,i)=>i+1, label:'Record', num:true},
    {h:'Date',     v:r=>fmtDate(r.date), xlDate:r=>r.date},
    {h:'Plot',     v:r=>`<b>${esc(r.plot)}</b>`,   raw:true},
    {h:'Batch',    v:r=>r.batch_no||'—'},
    {h:'Presence', v:r=>r.presence||'—'},
    {h:'Info',     v:r=>r.info_correct||'—'},
    {h:'Height',   v:r=>r.condition||'—'}
  ],
  /* `auditor_name` was in the select from the day this table was written
     and in none of its columns, so the one question the office actually
     asks of a maintenance record -- who did this -- could only be
     answered out of the database. It is a column now, and it names the
     ADMIN on a closure, because the closure writes whoever pressed the
     button. */
  maint:[
    /* #, Date, Plot and Task are the RECORD -- one task on one plot on one
       day -- drawn once over the cases it took. Case, Result and Done By
       stay per line: a closure and a real audit on the same plot, task and
       day are two cases that say different things, and that is exactly the
       pair the duplicate repair had to arbitrate 188 of. */
    {h:'#',       group:MOD_RECORD_KEY.maint,
                  v:(r,i,rows)=>_recNo(rows,i,MOD_RECORD_KEY.maint), label:'Record', num:true},
    {h:'Date',    group:MOD_RECORD_KEY.maint, v:r=>fmtDate(r.date), xlDate:r=>r.date},
    {h:'Plot',    group:MOD_RECORD_KEY.maint,
                  v:r=>`<b>${esc(r.plot)}</b>`,     raw:true},
    {h:'Task',    group:MOD_RECORD_KEY.maint, v:r=>r.task_type||'—'},
    /* THE CASE, because without it three rows reading B01 / Weeding /
       Unsatisfactory on one day are indistinguishable on screen -- and the
       office has now asked twice whether the report is counting one case
       three times. It is not: a maintenance task comes from ONE work
       record, so a plot weeded by three workers, or over three batches, is
       three tasks and three audits, and all three belong here. There is
       also a UNIQUE index on task_id (RUN_ME_remove_duplicate_audits.sql),
       so two rows CANNOT share a case any more -- which makes this column
       a proof rather than a label: three different numbers are three
       different cases, by construction.

       A sentence under the table saying all that would be the screen
       arguing for a figure. The column simply shows it. */
    {h:'Case',    v:r=>r.task_id==null ? '<span class="case-none">no case</span>'
                                       : `<span class="case-id">${esc(String(r.task_id))}</span>`,
                  raw:true},
    {h:'Result',  v:r=>r.result||'—'},
    {h:'Done By', v:r=>esc(r.auditor_name||'—')
                       + (maintDoneBy(r)==='admin'
                           ? ' <span class="doneby-tag">admin</span>' : ''), raw:true}
  ]
};

// Plot then Batch, both ascending — rows otherwise came back in whatever
// order Supabase happened to return them (newest-entered first in
// practice), which read as plot DESCENDING (B14, B12, B11, …) rather than
// the field-walk order B01, B02, B03, … an auditor actually reads a
// nursery in. Numeric-aware compare so B2 sorts before B10, not after it;
// papan's batch column is batch_no, maintenance has no batch at all — ??
// falls through to plot-only ordering for that one.
function _auditPlotBatchSort(rows){
  const natCmp=(a,b)=>String(a??'').localeCompare(String(b??''),undefined,{numeric:true,sensitivity:'base'});
  /* Plot, then the DAY, then the TASK, then batch.
     The day was not in here, so a plot audited twice in a month came out
     interleaved by batch -- the 5th and the 19th alternating down the page,
     which is two visits read as one. It also made the plot average
     unmergeable: a figure about a day can only be drawn once over the rows it
     covers if those rows are together.
     THE TASK IS IN HERE FOR THAT SECOND REASON, one module along. A
     maintenance record is a plot AND a task on a day, so B01 weeded and
     manured on the 21st is two records -- and sorted on plot and day alone
     their cases interleave, which would leave each record drawn as two or
     three broken runs instead of one block. It is undefined on every other
     module, where natCmp reads it as '' and the chain falls straight
     through to the batch.
     Dates are ISO in this table, so comparing them as text is comparing them
     as dates. */
  /* NURSERY FIRST, for the same reason it is in the record key: one table
     can hold several (the Main Nursery section does, and the spreadsheet
     puts them all in one sheet), and a run that interleaves two nurseries
     is a record drawn as two broken blocks. The plot codes are disjoint
     by prefix, so on screen this orders nothing differently. */
  return rows.slice().sort((a,b)=>natCmp(a.nursery,b.nursery)
                               ||natCmp(a.plot,b.plot)
                               ||natCmp(a.date,b.date)
                               ||natCmp(a.task_type,b.task_type)
                               ||natCmp(a.batch??a.batch_no,b.batch??b.batch_no));
}

/* THE PLOT'S AVERAGE FOR THAT DAY.

   An auditor walks a plot and measures several batches standing in it, one
   row each. The height that describes the PLOT is the mean of those rows, and
   until now the report had every batch and no plot figure at all, so it was
   worked out by hand off the paper.

   The mean of the row averages, which is what was asked for and what the Avg
   column already shows. Grouped on the day as well as the plot, because the
   same plot measured a fortnight later is a different reading, not more of
   the same one.

   Drawn ONCE over the rows it covers (see `group` in buildModTable), because
   the same figure printed on seven lines reads as seven measurements. */
function _heightPlotAvg(r, rows){
  const key=(x)=>String(x.date||'')+'|'+String(x.plot||'').trim().toUpperCase();
  const k=key(r);
  /* An EMPTY reading is not a zero. Number(null) is 0 and 0 is a finite
     number, so a row the auditor left blank would have been averaged in as a
     seedling of no height and pulled the plot down. A real 0 still counts --
     it is the blank that is thrown away, tested for before anything is
     converted. */
  const vals=(rows||[]).filter(x=>key(x)===k)
                       .map(x=>x.avg_height)
                       .filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='')
                       .map(Number)
                       .filter(v=>Number.isFinite(v));
  if(!vals.length) return '—';
  return hgtMean(vals.reduce((a,b)=>a+b,0)/vals.length);
}

/* ── HEIGHT BY BATCH ──────────────────────────────────────────────────

   Seedling Height is audited PLOT by plot in the Pre-Nursery — the form has
   no batch box on it at all, and audit_script.js says why. So "how tall is
   batch 268" is a question the height records cannot answer on their own.
   The ledger answers the first half: which plots a batch was sown into. The
   plot's own reading answers the second.

   WHICH BATCHES: the ones the Batch Record page calls Pre-Nursery — seeds
   received 1 to 4 months ago and not yet transplanted. Both tests are that
   page's own (operation_batch_record.html, processBatchLogic): the age is
   anchored on the KEYED transaction_date and never on the row's insert time,
   and any of the three Transplanted types means the batch has gone out.

   THREE PLAIN MEANS, one per level, each the average of the level below:

     plot  — its readings on its LAST audit day in the month
     batch — the mean of its plots
     age   — the mean of its batches

   A batch standing in three plots is ONE batch in its age group's figure,
   not three, which is why the group is not simply every reading in it
   averaged.

   AS AT THE MONTH, NOT AS AT TODAY. September's report has to read the same
   in December as it did in September: a batch is however old it was at the
   end of that month, and one transplanted afterwards was still standing in
   it. Same rule Life of Seedlings follows — the As At date cuts the lines
   off.                                                                   */
const BATCH_AGE_GROUPS=[1,2,3,4];
const DAYS_PER_MONTH=30.44;          // the Batch Record's own divisor

function _canonPlot(raw){
  const s=String(raw||'').trim().toUpperCase();
  const m=s.match(/^([A-Z]+)(\d+)(-R)?$/);
  return m?m[1]+m[2].padStart(2,'0')+(m[3]||''):s;
}
function _logDay(r){
  const v=r&&(r.transaction_date||r.created_at);
  return v?String(v).slice(0,10):'';
}
/* `fmt1` stood here and every one of its callers was a HEIGHT, so it is
   `hgtMean` now -- one figure that knows the unit it is being read in,
   rather than a rounder beside a unit written into a heading by hand.
   Do not put a second plain formatter back here for a height. */

/* Supabase answers with AT MOST 1000 rows and says nothing about it, so one
   read of the inventory ledger drops the oldest batches in silence. The
   Batch Record page pages for the same reason; this is that, through the
   audit portal's own fetch. */
async function sbAllRows(table,query){
  const PAGE=1000;
  let all=[];
  for(let off=0;;off+=PAGE){
    const rows=await sbFetch(`${table}?${query}&order=id.asc&limit=${PAGE}&offset=${off}`);
    all=all.concat(rows||[]);
    if(!rows||rows.length<PAGE) return all;
  }
}

async function fetchBatchLedger(to){
  const today=_localISO(new Date());
  /* AS AT THE END OF THE RANGE, never as at today -- so a range that has
     gone by reads the same in December as it did when it was current. A
     range running past today is as at today, there being nothing standing
     in a plot tomorrow. (It was the end of the month; it is the TO date
     now, which is the same sentence about a range somebody chose.) */
  const asOf=to<today?to:today;
  const LOG='shared_inventory_logs';
  const[seeds,planted,gone]=await Promise.all([
    sbAllRows(LOG,'select=batch_name,transaction_date,created_at&transaction_type=eq.Seeds_Received'),
    sbAllRows(LOG,'select=batch_name,plot_name&transaction_type=eq.Planted'),
    sbAllRows(LOG,'select=batch_name,transaction_date,created_at'
                 +'&transaction_type=in.(Transplanted,Transplanted_Premium,Transplanted_DoubleTone)')
  ]);
  return{asOf,seeds,planted,gone};
}

/* The plot's figure is its LAST audit day in the RANGE, not the range
   averaged: a plot walked on the 5th and again on the 19th grew in between,
   and the 19th is how tall it is now. Blank readings are dropped before
   anything is converted — Number(null) is 0, and a blank is not a seedling
   of no height. A real 0 still counts. */
function _plotHeightInRange(plot,heightRows){
  const mine=(heightRows||[]).filter(r=>_canonPlot(r.plot)===plot);
  if(!mine.length) return null;
  const day=mine.map(r=>String(r.date||'').slice(0,10)).filter(Boolean).sort().pop();
  if(!day) return null;
  const vals=mine.filter(r=>String(r.date||'').slice(0,10)===day)
                 .map(r=>r.avg_height)
                 .filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='')
                 .map(Number).filter(v=>Number.isFinite(v));
  if(!vals.length) return null;
  return{value:vals.reduce((a,b)=>a+b,0)/vals.length,date:day,n:vals.length};
}

function _mean(xs){
  return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
}

function buildBatchHeight(led,heightRows){
  const asOf=led.asOf;
  /* EARLIEST Seeds_Received per batch: one delivered in two lots is as old
     as its first lot, not its last. */
  const seedDay={};
  (led.seeds||[]).forEach(r=>{
    const b=String(r.batch_name||'').trim(),d=_logDay(r);
    if(!b||!d) return;
    if(!seedDay[b]||d<seedDay[b]) seedDay[b]=d;
  });
  const gone=new Set();
  (led.gone||[]).forEach(r=>{
    const b=String(r.batch_name||'').trim(),d=_logDay(r);
    if(b&&d&&d<=asOf) gone.add(b);
  });
  const plotsOf={};
  (led.planted||[]).forEach(r=>{
    const b=String(r.batch_name||'').trim(),p=_canonPlot(r.plot_name);
    if(!b||!p) return;
    (plotsOf[b]||(plotsOf[b]=new Set())).add(p);
  });

  const asOfMs=new Date(asOf+'T00:00:00').getTime();
  const natCmp=(a,b)=>String(a??'').localeCompare(String(b??''),undefined,{numeric:true,sensitivity:'base'});
  const rows=[],byBatch=[];
  Object.keys(seedDay).forEach(batch=>{
    if(gone.has(batch)) return;
    const days=Math.floor((asOfMs-new Date(seedDay[batch]+'T00:00:00').getTime())/86400000);
    if(days<0) return;                                  // sown after the month
    const months=days/DAYS_PER_MONTH;
    const grp=Math.floor(months);
    if(BATCH_AGE_GROUPS.indexOf(grp)<0) return;         // under 1, or over 4
    /* A batch with no Planted log has no plot to read, and is shown saying
       so rather than dropped: a batch missing from the ledger is the thing
       somebody needs to see. */
    const plots=[...(plotsOf[batch]||[])].sort(natCmp);
    const mine=(plots.length?plots:['—']).map(plot=>({
      batch,grp,months,seed:seedDay[batch],plot,
      h:plot==='—'?null:_plotHeightInRange(plot,heightRows)
    }));
    const avg=_mean(mine.filter(r=>r.h).map(r=>r.h.value));
    mine.forEach(r=>{r.batchAvg=avg;});
    rows.push(...mine);
    byBatch.push({batch,grp,avg});
  });

  rows.sort((a,b)=>a.grp-b.grp||natCmp(a.batch,b.batch)||natCmp(a.plot,b.plot));

  const groups={};
  BATCH_AGE_GROUPS.forEach(g=>{
    const mine=byBatch.filter(b=>b.grp===g);
    groups[g]={
      avg:_mean(mine.filter(b=>b.avg!=null).map(b=>b.avg)),
      batches:mine.length,
      unmeasured:mine.filter(b=>b.avg==null).length
    };
  });
  return{asOf,rows,groups,batches:byBatch.length};
}

const BATCH_HEIGHT_COLS=[
  {h:'#',        v:(r,i)=>i+1, label:'Row', num:true},
  /* Everything that is about the BATCH is drawn once over its plots —
     same merge the Plot Avg column uses. */
  {h:'Batch',    group:r=>r.batch, v:r=>`<b>${esc(r.batch)}</b>`, raw:true},
  {h:'Seeds In', group:r=>r.batch, v:r=>fmtDate(r.seed), xlDate:r=>r.seed},
  /* TRUNCATED, never rounded: the group is the whole months the batch has
     behind it, so an age shown as "2 mth" beside a group of "1 Month" reads
     as a mistake. 1.97 months is 1.9, and that is the same answer twice. */
  {h:'Age',      group:r=>r.batch, v:r=>(Math.floor(r.months*10)/10).toFixed(1)+' mth', num:true},
  {h:'Age Group',group:r=>r.batch, v:r=>r.grp+' Month'+(r.grp>1?'s':'')},
  {h:'Plot',     v:r=>`<b>${esc(r.plot)}</b>`, raw:true},
  {h:'Audited',  label:'Last audited', v:r=>r.h?fmtDate(r.h.date):'—',
                 xlDate:r=>r.h?r.h.date:null},
  {h:()=>hgtHead('Plot Avg'), label:()=>'Plot height ('+heightUnitLabel()+')',
   v:r=>r.h?hgtMean(r.h.value):'—', num:true},
  {h:()=>hgtHead('Batch Avg'),label:()=>'Batch average ('+heightUnitLabel()+')', group:r=>r.batch,
   v:r=>`<b>${hgtMean(r.batchAvg)}</b>`, raw:true, num:true}
];

function buildBatchHeightSection(bh){
  if(bh.error){
    return`
  <div class="mod-section">
    <div class="mod-head mod-head-batch">
      <div><div class="mod-head-title">Seedling Height by Batch</div>
      <div class="mod-head-sub">Could not be worked out</div></div>
    </div>
    <div class="mod-block"><div class="mod-block-body"><div class="no-data">
      The batch ledger could not be read, so no batch is listed here.<br>${esc(bh.error)}
    </div></div></div>
  </div>`;
  }
  const cards=BATCH_AGE_GROUPS.map(g=>{
    const s=bh.groups[g];
    return`<div class="sum-card">
      <div class="sum-val" style="color:var(--batch)">${hgtMean(s.avg)}</div>
      <div class="sum-label">${g} Month${g>1?'s':''} Old</div>
      <div class="sum-foot">${fmtNum(s.batches)} batch${s.batches===1?'':'es'}${
        s.unmeasured?' · '+fmtNum(s.unmeasured)+' unmeasured':''}</div>
    </div>`;
  }).join('');
  /* How many of these batches nobody has measured this month. Said out loud,
     because four averages with no count beside them cannot say whether they
     are drawn from everything or from half of it. */
  const unmeasured=BATCH_AGE_GROUPS.reduce((s,g)=>s+bh.groups[g].unmeasured,0);
  return`
  <div class="mod-section">
    <div class="mod-head mod-head-batch">
      <div><div class="mod-head-title">Seedling Height by Batch</div>
      <div class="mod-head-sub">Pre-Nursery batches 1–4 months old and not yet transplanted ·
        age as at ${fmtDate(bh.asOf)}</div></div>
      <span class="mod-head-badge">${fmtNum(bh.batches)} batches</span>
    </div>
    <div class="mod-block">
      <div class="mod-block-head">
        <!-- The four cards under this carry no unit of their own, so this
             line is what says which they are in. -->
        <span class="mod-block-name">${hgtHead('Average Height by Age')}</span>
        ${unmeasured?`<span class="badge badge-batch">${fmtNum(unmeasured)} with no reading</span>`:''}
      </div>
      <div class="mod-block-body">
        <div class="age-row"><div class="summary-row">${cards}</div></div>
        ${buildTable(BATCH_HEIGHT_COLS,bh.rows,'batch row')}
      </div>
    </div>
  </div>`;
}

function buildModTable(mod, rows){
  if(!rows||!rows.length) return '<div class="no-data">No records found.</div>';
  const cols=MOD_COLS[mod];
  if(!cols) return '<div class="no-data">No records found.</div>';
  const sorted=_auditPlotBatchSort(rows);
  const keyOf=MOD_RECORD_KEY[mod];
  if(!keyOf) return buildTable(cols,sorted,'record');
  /* THE FOOT SAYS BOTH FIGURES wherever they differ -- "18 records · 47
     batches". The records figure is the one every other figure on the page
     now carries, and somebody who knew the table as 47 rows has to be able
     to see where the 47 went; saying only the smaller number is how a count
     that dropped reads as work that vanished. */
  const recs=recordCount(mod,sorted);
  const noun=MOD_LINE_NOUN[mod]||['line','lines'];
  const total='Total: '+fmtNum(recs)+' record'+(recs!==1?'s':'')
            + (sorted.length!==recs
                ? ' · '+fmtNum(sorted.length)+' '+noun[sorted.length===1?0:1]
                : '');
  return buildTable(cols,sorted,'record',{contKey:keyOf,contNote:MOD_CONT_NOTE[mod],total});
}

/* The table itself, given its columns and its rows ALREADY in the order they
   are to be drawn in. The row merging below reads off that order, so a
   caller that sorts after this has broken it. */
function buildTable(cols, rows, noun, opts){
  if(!rows||!rows.length) return '<div class="no-data">No records found.</div>';
  opts=opts||{};

  /* A merged column's heading is centred over it, or the heading and the
     figure it names sit at opposite ends of the same column. */
  const head='<tr>'+cols.map(c=>`<th${c.group?' class="grp"':''}>${esc(colHead(c))}</th>`).join('')+'</tr>';

  /* A COLUMN THAT IS ONE CELL FOR A WHOLE GROUP.
     The plot average is one figure about seven rows, and seven copies of it
     is seven chances to read it as seven different measurements. A column
     with `group` is drawn once, on the first row of its run, spanning the
     rest -- so the table says plainly that the figure belongs to the block
     beside it and not to any one line of it.

     The run has to be CONSECUTIVE, which the caller's sort is what makes it:
     a plot's rows for a day sit together, and so do a batch's plots. Keyed
     off the array as given for that reason, not off the data. */
  const spans=cols.map(c=>{
    if(!c.group) return null;
    const out=new Array(rows.length).fill(0);
    let i=0;
    while(i<rows.length){
      let j=i;
      while(j+1<rows.length && c.group(rows[j+1])===c.group(rows[i])) j++;
      out[i]=j-i+1;
      i=j+1;
    }
    return out;
  });

  let body='';
  rows.forEach((r,i)=>{
    /* A line that CONTINUES the record above it. On a desk and on paper the
       rowspan says so by itself and this mark paints nothing; on a phone the
       table is one card per row and a rowspan means nothing at all, so
       without it the cards after the first carry a batch and its readings
       with no plot and no day on them. */
    const cont=opts.contKey && i>0 && opts.contKey(rows[i-1])===opts.contKey(r);
    body+=(cont?`<tr class="rec-cont" data-cont="${esc(opts.contNote||'continued')}">`:'<tr>')
        +cols.map((c,ci)=>{
      // A row inside a group that is not its first draws no cell at all.
      if(spans[ci] && !spans[ci][i]) return '';
      /* rows as well as the row: a column can be a figure about the GROUP
         this row is in -- see _heightPlotAvg. */
      const val=c.v(r,i,rows);
      const span=spans[ci] && spans[ci][i]>1 ? ` rowspan="${spans[ci][i]}"` : '';
      const cls=[c.num?'num':'', spans[ci]?'grp':''].filter(Boolean).join(' ');
      /* colLabel is what the cell announces itself as on a phone, where
         it is a card row rather than a column: "#" is a column heading
         and says nothing on its own once the heading row is gone. */
      return `<td data-label="${esc(colLabel(c))}"${cls?` class="${cls}"`:''}${span}>${c.raw?val:esc(val)}</td>`;
    }).join('')+'</tr>';
  });
  const word=noun||'record';
  const total=opts.total
    || `Total: ${fmtNum(rows.length)} ${esc(word)}${rows.length!==1?'s':''}`;
  body+=`<tr class="total-row"><td colspan="${cols.length}" data-label="">${total}</td></tr>`;

  return`<div class="tbl-wrap"><table class="rec-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

/* The modules that are a block INSIDE a nursery section. Height by Batch is
   not one of them — it draws a section of its own, because the batches it
   lists are not divided by nursery and its figures are about the batch. */
const NURSERY_MODS=['plot','height','papan','maint'];

/* Set by generateReport when the Done By tick took rows out, and read by
   buildNurserySection a moment later -- the same shape selectedMods
   already has, rather than threading one more argument through a
   function every module shares. Null means nothing was narrowed. */
let _maintNarrowed = null;

/* `mods` is PASSED, never read off the panel. The sheet can be redrawn
   after it was generated -- a unit change does exactly that -- and the
   ticks may have been moved in between, so a section built off the live
   panel would draw a module the report was never generated for. */
function buildNurserySection(label, sub, headClass, data, nurseries, allMods){
  const mods=allMods.filter(m=>NURSERY_MODS.indexOf(m)>=0);
  const modLabels={plot:'📋 Plot Condition',height:'📏 Seedling Height',papan:'🪧 Papan Tanda',maint:'🔧 Maintenance'};
  const modBadge={plot:'badge-plot',height:'badge-height',papan:'badge-papan',maint:'badge-maint'};
  let total=0;
  let modSections='';
  mods.forEach(mod=>{
    const rows=filterByNursery(data[mod],nurseries);
    /* RECORDS, not rows -- see MOD_RECORD_KEY. On the two modules with a
       record key this is fewer than the rows in the table, and the table's
       own foot says both figures. */
    const recs=recordCount(mod,rows);
    total+=recs;
    modSections+=`
      <div class="mod-block">
        <div class="mod-block-head">
          <span class="mod-block-name">${modLabels[mod]}</span>
          <span class="badge ${modBadge[mod]}">${fmtNum(recs)} records</span>
          ${mod==='maint'&&_maintNarrowed?`<span class="mod-block-note">${esc(_maintNarrowed)}</span>`:''}
        </div>
        <div class="mod-block-body">${buildModTable(mod,rows)}</div>
      </div>`;
  });
  return`
  <div class="mod-section">
    <div class="mod-head ${headClass}">
      <div><div class="mod-head-title">${label}</div><div class="mod-head-sub">${sub}</div></div>
      <span class="mod-head-badge">${fmtNum(total)} total</span>
    </div>
    ${modSections}
  </div>`;
}

/* ══ THE REPORT AS A SPREADSHEET ═══════════════════════════════════════

   *"and it also able to download in excel"*. The sheet printed off this
   page is read by somebody adding up; the spreadsheet is read by somebody
   who wants to FILTER, SORT and PIVOT it, and that is the whole of what
   decides the shape below.

   A REAL .xlsx, WRITTEN HERE -- no library and no fetch. Two reasons, and
   the first is the one that rules CSV out on its own:

   - **A CASE ID IS THIRTEEN DIGITS.** Excel reads a bare 1791248487117 in
     a CSV as a number and shows it as 1.79125E+12, so the one column the
     office asked for twice would arrive destroyed. An xlsx cell declares
     its own type, so the case goes in as TEXT and reads back exactly.
   - **Nothing to 404 at the moment somebody presses the button**, which is
     the same argument the papan tanda logo is inlined for. A spreadsheet
     that needs a CDN is a button that fails on the day the office is
     somewhere with a captive portal.

   THE SHAPE IS NOT THE PAGE'S, and that is deliberate:

   - **ONE SHEET PER MODULE, with a NURSERY COLUMN**, where the page draws
     a Pre Nursery section and a Main Nursery one. A filter on that column
     is the two sections back, and a spreadsheet split across sheets by
     something that could be a column is one somebody has to glue together
     before they can total it.
   - **EVERY LINE CARRIES ITS OWN PLOT, DAY AND TASK.** The table merges
     them down the side of a record because that is how a visit reads on
     paper -- and a merged cell in Excel breaks sorting and filtering,
     which is what the file is FOR. The RECORD NUMBER column is what keeps
     the grouping readable: the same number down three lines is one visit,
     and it sorts and pivots.
   - **The figures are numbers and the ids are text**, off the column's own
     `num` flag -- the one MOD_COLS already carries to decide alignment, so
     there is no second list saying which column is a figure. The dates are
     REAL DATES (`xlDate`), so a filter by month is a filter by month and
     not a text match.

   And the first sheet is the CONTEXT -- the range, the nurseries, the plot
   search, what was counted. A spreadsheet that has left the screen with no
   idea which dates it covers is a figure nobody can check. */

/* ── the zip, store-only ── */
let _crcTable=null;
function _crc32(buf){
  if(!_crcTable){
    _crcTable=new Int32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      _crcTable[n]=c;
    }
  }
  let c=-1;
  for(let i=0;i<buf.length;i++) c=(c>>>8)^_crcTable[(c^buf[i])&0xFF];
  return (c^-1)>>>0;
}
/* STORED rather than deflated: a month of audits comes to a megabyte or
   two, which is nothing to download, and the alternative is either a
   library or CompressionStream -- a second thing that can be absent on a
   phone. A stored zip is one every reader has opened since 1989. */
function _zipBlob(files){
  const enc=new TextEncoder();
  const parts=[], central=[];
  let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.data;
    const crc=_crc32(data), len=data.length;
    const loc=new Uint8Array(30+name.length), lv=new DataView(loc.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true);
    lv.setUint16(6,0x0800,true);          // the name is UTF-8
    lv.setUint16(8,0,true);               // stored
    lv.setUint16(10,0,true); lv.setUint16(12,0x0021,true);  // 1980-01-01
    lv.setUint32(14,crc,true); lv.setUint32(18,len,true); lv.setUint32(22,len,true);
    lv.setUint16(26,name.length,true);
    loc.set(name,30);
    parts.push(loc,data);

    const cen=new Uint8Array(46+name.length), cv=new DataView(cen.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
    cv.setUint16(12,0,true); cv.setUint16(14,0x0021,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,len,true); cv.setUint32(24,len,true);
    cv.setUint16(28,name.length,true);
    cv.setUint32(42,offset,true);
    cen.set(name,46);
    central.push(cen);
    offset+=loc.length+len;
  });
  const cenLen=central.reduce((s,c)=>s+c.length,0);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenLen,true); ev.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[end]),
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ── the sheet ── */
function _xq(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    /* A control character is not legal in XML and Excel refuses the whole
       workbook over one, which reads to the office as a broken button. */
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
}
function _colName(i){
  let s='';
  for(i+=1;i>0;i=Math.floor((i-1)/26)) s=String.fromCharCode(65+((i-1)%26))+s;
  return s;
}
/* The 1900 system Excel reads, counted off 1899-12-30. UTC on both sides,
   so a timezone cannot move a day. */
function _xlSerial(iso){
  const p=String(iso||'').slice(0,10).split('-');
  if(p.length!==3) return null;
  const t=Date.UTC(+p[0],+p[1]-1,+p[2]);
  if(!Number.isFinite(t)) return null;
  return Math.round((t-Date.UTC(1899,11,30))/86400000);
}
/* The text a cell would READ on the page. The column functions return
   markup on the ones marked raw, and the browser is what turns that back
   into words -- so the sheet cannot say something the table does not. */
function _xlText(v){
  const s=String(v==null?'':v);
  let t=s;
  if(s.indexOf('<')>=0){
    const d=document.createElement('div');
    d.innerHTML=s;
    t=(d.textContent||'').trim();
  }
  /* THE TABLE'S DASH IS A SPREADSHEET'S EMPTY CELL. On paper an em dash
     says "nothing here" in a column that has to stay aligned; in a
     spreadsheet it is a VALUE -- it sorts after every number, it turns up
     in the filter list as something to tick, and it stops a column of
     figures being a column of figures. */
  return t==='—' ? '' : t;
}
function _sheetXml(head, rows, opts){
  const nCols=head.length;
  const plain=!!(opts&&opts.plain);
  /* Sized off the content, so nothing arrives as ##### or as a column of
     air. Capped, because one long remark must not push every other column
     off the screen.

     A DATE CELL HOLDS A SERIAL AND SHOWS A DATE, so its own value is five
     characters wide and what the reader sees is ten -- measured off the
     value alone, every date column arrives as #####, which is the one
     failure that looks like broken data rather than a narrow column. */
  const width=head.map((h,ci)=>{
    let w=String(h).length, isDate=false;
    rows.forEach(r=>{
      const c=r[ci]; if(!c) return;
      if(c.t==='d') isDate=true;
      const t=c.v!=null?String(c.v):''; if(t.length>w) w=t.length;
    });
    if(isDate&&w<10) w=10;
    return Math.min(Math.max(w+2,8),42);
  });
  let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    /* The heading stays on screen however far down somebody scrolls, and
       every column carries a filter -- which is the whole reason this is a
       spreadsheet and not a picture of a table. Not on the context sheet:
       it is a list of what the report was OF rather than a table, and a
       filter button over "From date" is a control that answers nothing. */
    + (plain?''
       : '<sheetViews><sheetView workbookViewId="0">'
         +'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'
         +'</sheetView></sheetViews>')
    + '<cols>'+width.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>'
    + '<sheetData>';
  const cell=(ci,ri,c)=>{
    const ref=_colName(ci)+(ri+1);
    if(!c||c.v==null||c.v==='') return '';
    if(c.t==='d') return `<c r="${ref}" s="2"><v>${c.v}</v></c>`;
    if(c.t==='n') return `<c r="${ref}"><v>${c.v}</v></c>`;
    const s=c.t==='h'?' s="1"':'';
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${_xq(c.v)}</t></is></c>`;
  };
  xml+='<row r="1">'+head.map((h,ci)=>cell(ci,0,{v:h,t:'h'})).join('')+'</row>';
  rows.forEach((r,ri)=>{
    xml+=`<row r="${ri+2}">`+r.map((c,ci)=>cell(ci,ri+1,c)).join('')+'</row>';
  });
  xml+='</sheetData>';
  if(rows.length&&!plain) xml+=`<autoFilter ref="A1:${_colName(nCols-1)}${rows.length+1}"/>`;
  return xml+'</worksheet>';
}
/* Excel refuses a sheet name over 31 characters or carrying any of
   []:*?/\ -- and refuses the WHOLE workbook, so it is trimmed here rather
   than left to be discovered by the office. */
function _sheetName(s, taken){
  let n=String(s||'Sheet').replace(/[\[\]:*?/\\]/g,' ').trim().slice(0,31)||'Sheet';
  let i=2, base=n;
  while(taken.indexOf(n)>=0){ n=(base.slice(0,28)+' '+i).slice(0,31); i++; }
  taken.push(n);
  return n;
}
function _xlsxBlob(sheets){
  const enc=new TextEncoder();
  const taken=[];
  const named=sheets.map(s=>({name:_sheetName(s.name,taken),head:s.head,rows:s.rows,plain:!!s.plain}));
  const f=[];
  const add=(name,text)=>f.push({name,data:enc.encode(text)});
  add('[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    +named.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
    +'</Types>');
  add('_rels/.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    +'</Relationships>');
  add('xl/workbook.xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
    +' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    +named.map((s,i)=>`<sheet name="${_xq(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')
    +'</sheets></workbook>');
  add('xl/_rels/workbook.xml.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +named.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
    +`<Relationship Id="rId${named.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
    +'</Relationships>');
  /* Three formats and no more: plain, bold for the heading row, and the
     builtin short date (numFmtId 14), which Excel draws in whatever the
     reader's own locale is. */
  add('xl/styles.xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
    +'<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    +'<fills count="2"><fill><patternFill patternType="none"/></fill>'
    +'<fill><patternFill patternType="gray125"/></fill></fills>'
    +'<borders count="1"><border/></borders>'
    +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    +'<cellXfs count="3">'
    +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    +'<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
    +'<xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
    +'</cellXfs>'
    +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
    +'</styleSheet>');
  named.forEach((s,i)=>add(`xl/worksheets/sheet${i+1}.xml`,_sheetXml(s.head,s.rows,{plain:s.plain})));
  return _zipBlob(f);
}

/* ── what goes in it ──
   Built off MOD_COLS and the same sorted rows the tables are drawn from,
   so a column added to the report is in the spreadsheet without anybody
   listing it a second time. */
/* ONE CELL BUILDER, because there are two tables to turn into sheets --
   the module ones and Height by Batch -- and two copies of this would be
   two answers to "is this column a date". */
function _xlCell(c, r, i, rows){
  if(c.xlDate){
    const n=_xlSerial(c.xlDate(r));
    if(n!=null) return {v:n,t:'d'};
  }
  const txt=_xlText(c.v(r,i,rows));
  /* A FIGURE IS A NUMBER AND AN ID IS NOT, and the column already says
     which it is: `num` is the flag the table aligns on. The Case column
     does not carry it, which is what keeps a thirteen-digit case out of
     scientific notation. */
  if(c.num && txt!=='' && Number.isFinite(Number(txt.replace(/,/g,''))))
    return {v:Number(txt.replace(/,/g,'')),t:'n'};
  return {v:txt,t:'s'};
}
function _xlSheetOf(cols, rows, lead){
  if(!cols||!rows||!rows.length) return null;
  /* colHead, not `c.h`: a height column's heading is a function of the
     unit on screen, and a spreadsheet headed (cm) over a column of metres
     is the worst of the three places this could go wrong. */
  const head=(lead?[lead.h]:[]).concat(cols.map(colHead));
  const body=rows.map((r,i)=>
    (lead?[{v:lead.v(r),t:'s'}]:[]).concat(cols.map(c=>_xlCell(c,r,i,rows))));
  return {head,rows:body};
}
function _modSheet(mod, rows){
  /* Sorted exactly as the table is, so the Record number means the same
     thing in both -- `_recNo` numbers consecutive runs, and a different
     order is a different numbering. */
  return _xlSheetOf(MOD_COLS[mod], rows&&rows.length?_auditPlotBatchSort(rows):rows,
                    {h:'Nursery', v:r=>r.nursery||''});
}

/* The last report DRAWN: what the Excel is of, and what a height-unit
   change redraws from. One object rather than two, because the two would
   be the same report answering in two units. Null until somebody has
   generated one, which is what both readers check first. */
let _lastReport=null;

function downloadExcel(){
  const R=_lastReport;
  if(!R){ showToast('⚠ Generate the report first'); return; }
  try{
    const sheets=[];
    /* THE CONTEXT SHEET FIRST. A spreadsheet is forwarded, saved and
       opened months later, and one with no idea which dates it covers is
       a column of figures nobody can check. */
    const ctx=[
      ['From date', R.from], ['To date', R.to],
      ['Period', R.period||''],
      ['Nurseries', R.nurseryLabel],
      ['Plot search', R.plotQuery||'(all plots)'],
      ['Generated', R.generated],
      ['', ''],
      ['Module', 'Records']
    ].map(p=>[{v:p[0],t:'s'},{v:p[1],t:'s'}]);
    (R.counts||[]).forEach(c=>ctx.push([{v:c[0],t:'s'},{v:c[1],t:'n'}]));
    /* A RECORD IS A VISIT and the lines under it are its batches or its
       cases -- said here too, because the sheets below carry one line per
       batch and a reader counting rows would otherwise get the other
       figure. */
    ctx.push([{v:'',t:'s'},{v:'',t:'s'}]);
    ctx.push([{v:'A record is one visit — the same plot on the same day, '
               +'whatever the batch; the same plot and task on the same day, '
               +'whatever the case. Its batches and cases are the lines under '
               +'it, and each carries the Record number.',t:'s'},{v:'',t:'s'}]);
    sheets.push({name:'Report',head:['Monthly Audit Report',''],rows:ctx,plain:true});

    const labels={plot:'Plot Condition',height:'Seedling Height',
                  papan:'Papan Tanda',maint:'Maintenance'};
    /* R.mods and not the live panel, the same rule the sections follow:
       the spreadsheet is of the report that was DRAWN, and the ticks may
       have been moved since without anybody pressing Generate. */
    (R.mods||[]).filter(m=>NURSERY_MODS.indexOf(m)>=0).forEach(mod=>{
      const s=_modSheet(mod,R.sheetData[mod]);
      if(s) sheets.push({name:labels[mod]||mod,head:s.head,rows:s.rows});
    });
    /* Height by Batch is about BATCHES rather than about a nursery's
       audits, which is why it is a section of its own on the page -- and a
       sheet of its own here, drawn off its own columns. */
    if(R.batchHeight&&!R.batchHeight.error){
      const bh=_xlSheetOf(BATCH_HEIGHT_COLS,R.batchHeight.rows||[],null);
      if(bh) sheets.push({name:'Height by Batch',head:bh.head,rows:bh.rows});
    }
    if(sheets.length===1){ showToast('⚠ Nothing in the report to put in a sheet'); return; }

    const blob=_xlsxBlob(sheets);
    const name='MJM Audit Report '+R.from+' to '+R.to+'.xlsx';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a);
    a.click();
    /* Revoked on a timer rather than at once: Safari has not started the
       download by the time the handler returns, and a revoked url there is
       a button that does nothing. */
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
    showToast('✓ Excel downloaded');
  }catch(e){
    /* A throw inside an onclick does nothing and says nothing -- the claim
       form had to learn that once already. */
    console.error('[excel]',e);
    showToast('⚠ Could not build the Excel: '+e.message);
  }
}

async function generateReport(){
  // Nursery and Modules both start untied to anything — see their markup's
  // own comment — so a click with nothing ticked in either is "forgot to
  // pick", not "meant everything". Caught here rather than by re-ticking a
  // checkbox on uncheck (which would have made "nothing ticked" an
  // impossible state to ever be in, including the moment the page loads).
  if(selectedMods.size===0){showToast('⚠ Select at least one module');return;}
  const tickedNurseries=selectedAuditNurseries();
  /* The nursery tick decides what goes in the two nursery sections, so it is
     only asked for when one of those is wanted. Height by Batch on its own
     has no nursery to pick: it lists the batches that have not left the
     Pre-Nursery yet, whichever nursery is ticked. */
  const wantNurserySections=[...selectedMods].some(m=>NURSERY_MODS.indexOf(m)>=0);
  if(wantNurserySections&&tickedNurseries.length===0){showToast('⚠ Select at least one nursery');return;}

  /* THE RANGE, both ends inclusive. ISO text compares as a date, which is
     what lets the from/to test below be a string comparison -- the same
     reasoning the row sort already relies on. An empty box is somebody not
     having picked rather than "everything", because a report with one end
     open is not a thing anybody means to ask for. */
  const from=document.getElementById('f-from').value;
  const to=document.getElementById('f-to').value;
  if(!from||!to){showToast('⚠ Pick a from date and a to date');return;}
  if(from>to){showToast('⚠ The from date is after the to date');return;}
  const plotQuery=document.getElementById('f-plot').value.trim();
  // Whichever of Pre-Nursery/BNN/UNN1/UNN2 are ticked (see the tick-chip
  // row) — Main Nursery is no longer all-or-nothing: BNN can be included
  // without UNN1/UNN2, same as PN can sit alongside just one of them.
  const showPN=wantNurserySections&&tickedNurseries.includes('PN');
  const mnNurseries=MN_NURSERIES.filter(n=>tickedNurseries.includes(n));
  const showMN=wantNurserySections&&mnNurseries.length>0;
  const periodStr=periodLabel(from,to);
  setLoading(true);
  try{
    const data=await fetchData(from,to);
    // Plot search narrows every module's rows before anything downstream
    // (summary counts, the nursery-section tables) ever sees them, so
    // there's exactly one place this filter has to be applied.
    if(plotQuery) for(const m of ['plot','height','papan','maint']) if(data[m]) data[m]=filterByPlot(data[m],plotQuery);
    /* Narrowed in the SAME place and for the same reason: every figure
       downstream -- the summary card, the section total, the records
       badge and the table itself -- is counted off data.maint, so a
       filter applied anywhere else would leave one of them disagreeing
       with the rest. */
    const doneBy=selectedDoneBy();
    if(selectedMods.has('maint')&&data.maint){
      const before=data.maint.length;
      data.maint=filterByDoneBy(data.maint,doneBy);
      /* A REPORT SHORT OF ROWS HAS TO SAY WHY. Printed, this sheet is
         read by somebody adding up, and a maintenance table narrowed to
         one kind is indistinguishable from a month that only had that
         kind in it. Said only where it NARROWED something -- a note on a
         report nothing was taken out of is a note nobody reads. */
      /* CASES, not records: what this tick takes out is rows, and a row
         here is one case. A record can lose one of its cases and still be
         on the report, so calling them records would be a figure that does
         not match the one in the badge above it. */
      const dropped=before-data.maint.length;
      _maintNarrowed = dropped>0
        ? (doneBy.length===0
            ? 'all '+fmtNum(before)+' hidden — nothing ticked under Done By'
            : 'showing '+(doneBy.indexOf('admin')!==-1?'admin closures':'auditor audits')
              +' only — '+fmtNum(dropped)+' other '+(dropped===1?'case':'cases')+' hidden')
        : null;
    } else {
      _maintNarrowed = null;
    }
    /* The ledger reads are the one part of this report that can fail on its
       own, and a section that quietly draws nothing is a section that says
       there are no batches. It says what went wrong instead. */
    let batchHeight=null;
    if(selectedMods.has('bheight')){
      try{ batchHeight=buildBatchHeight(await fetchBatchLedger(to),data.height||[]); }
      catch(e){ console.error('[batch-height]',e); batchHeight={error:e.message}; }
    }
    /* EVERYTHING THE DRAWING HALF NEEDS, and nothing it can read off the
       panel. The reads above are the expensive part -- the batch half
       pages the whole inventory ledger -- so changing the UNIT must not go
       near them, and the only way to be sure of that is for the drawing to
       take its inputs rather than fetch them.

       `at` rides along for the same reason: the Generated line is when the
       report was GENERATED, and reading it in another unit a minute later
       has not generated anything. */
    drawReport({ data, batchHeight, from, to, plotQuery,
                 showPN, showMN, mnNurseries,
                 mods:[...selectedMods], maintNarrowed:_maintNarrowed,
                 at:new Date() });
    document.getElementById('print-bar').classList.remove('hidden');
    /* Only on a phone: on a desk the filters and the report both fit. */
    if(window.matchMedia('(max-width:720px)').matches) setFilters(false);
    showToast('✓ Report generated');
  }catch(e){
    console.error(e);
    showToast('⚠ Failed: '+e.message);
  }
  setLoading(false);
}

function drawReport(rep){
  const {data,batchHeight,from,to,plotQuery,showPN,showMN,mnNurseries,mods,at}=rep;
  /* Read by buildNurserySection a moment later -- restored here rather
     than left standing, because a redraw must say exactly what the
     generate said. */
  _maintNarrowed=rep.maintNarrowed;
  const periodStr=periodLabel(from,to);
  const has=(m)=>mods.indexOf(m)!==-1;
  const countAll=(d,n)=>mods.filter(m=>NURSERY_MODS.indexOf(m)>=0)
                            .reduce((s,m)=>s+recordCount(m,filterByNursery(d[m],n)),0);
    const pnTotal=showPN?countAll(data,PN_NURSERIES):0;
    const mnTotal=showMN?countAll(data,mnNurseries):0;
    const grandTotal=pnTotal+mnTotal;
    /* What the heading says is what was DRAWN. With only Height by Batch
       ticked there is no nursery section at all, so naming the nursery that
       happens to be ticked would name a section that is not on the page. */
    const drawnMN=showMN?mnNurseries:[];
    const nurseryLabel = (showPN && drawnMN.length===MN_NURSERIES.length) ? 'All Nurseries'
      : [...(showPN?['Pre Nursery']:[]), ...drawnMN].join(', ') || 'Batches';

    // Count per module across selected nurseries
    const countedNurseries = [...(showPN?PN_NURSERIES:[]), ...drawnMN];
    /* Through recordCount, so the card agrees with the badge and the table
       foot under it. Height and Papan have no record key and so still count
       rows, which is what one sign and one plot measurement each are. */
    const plotTotal   = recordCount('plot',  filterByNursery(data.plot||[],   countedNurseries));
    const heightTotal = recordCount('height',filterByNursery(data.height||[], countedNurseries));
    const papanTotal  = recordCount('papan', filterByNursery(data.papan||[],  countedNurseries));
    const maintTotal  = recordCount('maint', filterByNursery(data.maint||[],  countedNurseries));

    let summaryCards=`<div class="sum-card"><div class="sum-val">${fmtNum(grandTotal)}</div><div class="sum-label">Total Audits</div></div>`;
    if(has('plot'))   summaryCards+=`<div class="sum-card"><div class="sum-val" style="color:var(--pn)">${fmtNum(plotTotal)}</div><div class="sum-label">Plot Condition</div></div>`;
    if(has('height')) summaryCards+=`<div class="sum-card"><div class="sum-val" style="color:var(--mn)">${fmtNum(heightTotal)}</div><div class="sum-label">Seedling Height</div></div>`;
    if(has('papan'))  summaryCards+=`<div class="sum-card"><div class="sum-val" style="color:var(--papan)">${fmtNum(papanTotal)}</div><div class="sum-label">Papan Tanda</div></div>`;
    if(has('maint'))  summaryCards+=`<div class="sum-card"><div class="sum-val" style="color:var(--maint)">${fmtNum(maintTotal)}</div><div class="sum-label">Maintenance</div></div>`;
    if(batchHeight&&!batchHeight.error) summaryCards+=`<div class="sum-card"><div class="sum-val" style="color:var(--batch)">${fmtNum(batchHeight.batches)}</div><div class="sum-label">Batches 1–4 Mth</div></div>`;

    let sections='';
    if(showPN) sections+=buildNurserySection('Pre Nursery (PN)','Plots P01 – P52','mod-head-pn',data,PN_NURSERIES,mods);
    if(showMN){
      // Range shown under the heading follows whichever of BNN/UNN1/UNN2
      // actually made it in, not always all three.
      const MN_RANGES={BNN:'B01–B14',UNN1:'U01–U18',UNN2:'N01–N20'};
      sections+=buildNurserySection(
        `Main Nursery (${mnNurseries.join(' + ')})`,
        mnNurseries.map(n=>MN_RANGES[n]).join(' · '),
        'mod-head-mn',data,mnNurseries,mods);
    }
    /* Last, and outside both: these batches are in the Pre-Nursery by
       definition (they have not been transplanted), but the section answers
       a question about batches rather than about a nursery's audits, so it
       does not hang off either nursery's tick. */
    if(batchHeight) sections+=buildBatchHeightSection(batchHeight);

    document.getElementById('report-output').innerHTML=`
      <div class="report-header">
        <div class="report-title">Monthly Audit Report</div>
        <div class="report-period">${periodStr} · ${nurseryLabel}${plotQuery?' · Plot: '+esc(plotQuery):''}</div>
        <div class="report-generated">Generated: ${at.toLocaleString('en-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="summary-row">${summaryCards}</div>
      ${sections}`;
  /* WHAT THE EXCEL IS OF, recorded here and nowhere else. The sheets are
     the rows that were DRAWN -- narrowed by plot, by Done By and by
     nursery exactly as the tables above are -- so a figure in the
     spreadsheet cannot disagree with the card it was read off. A second
     read scoped its own way is how the two come to differ.

     IT RIDES ON THE DRAWING PAYLOAD rather than in a second variable: a
     unit change REDRAWS (see setHeightUnit) and the spreadsheet has to
     come down in the unit on screen -- which it does by construction,
     because _xlSheetOf asks the same columns for the same headings and
     the same values this draw just did. Worked out here, where the
     figures it quotes are, and so re-made identically on every redraw. */
  _lastReport=Object.assign({},rep,{
    period:periodStr, nurseryLabel,
    generated:at.toLocaleString('en-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    counts:[
      ...(has('plot')   ?[['Plot Condition',  plotTotal]]  :[]),
      ...(has('height') ?[['Seedling Height', heightTotal]]:[]),
      ...(has('papan')  ?[['Papan Tanda',     papanTotal]] :[]),
      ...(has('maint')  ?[['Maintenance',     maintTotal]] :[]),
      ['Total Audits', grandTotal]
    ],
    sheetData:{
      plot:  filterByNursery(data.plot||[],  countedNurseries),
      height:filterByNursery(data.height||[],countedNurseries),
      papan: filterByNursery(data.papan||[], countedNurseries),
      maint: filterByNursery(data.maint||[], countedNurseries)
    }
  });
  syncHeightUnitBar(has('height')||has('bheight'));
}

/* ── THE HEIGHT UNIT CONTROL ──────────────────────────────────────────
   In the TOOLBAR and not the filter panel, because it is not a filter:
   nothing is read, nothing is narrowed, and the same report is simply
   read in another unit. Pressing it goes nowhere near the database --
   see drawReport for why that matters.

   It is OFFERED ONLY where the report has a height on it, the same rule
   the Done By row follows: a control over a module that is not on the
   page is a control that does nothing. */
function syncHeightUnitBar(show){
  const bar=document.getElementById('unit-bar');
  if(!bar) return;
  bar.style.display=show?'':'none';
  bar.querySelectorAll('.tbtn-unit').forEach(b=>{
    const on=b.dataset.unit===_heightUnit;
    b.classList.toggle('is-on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
  });
}

function setHeightUnit(u){
  if(!HEIGHT_UNITS[u]||u===_heightUnit) return;
  _heightUnit=u;
  /* The redraw is what repaints the buttons as well (drawReport ends on
     syncHeightUnitBar), so there is one place that says which is on. With
     no report drawn the bar is not on screen to be pressed. */
  if(_lastReport) drawReport(_lastReport);
}

document.addEventListener('DOMContentLoaded',initFilters);
</script>
