     audit_supabase.js, so load order cannot leave a gap. -->

<!-- Shared FC-style top ribbon: 555 / MJM Nursery wordmark, welcome name,
     way back, sign out. The same bar audit_admin.html carries, so the
     report reads as part of the back office rather than as a phone screen
     that happens to be reachable from it. -->
<link rel="stylesheet" href="audit_ribbon.css?v=20260826a"/>
<style>
/* ══════════════════════════════════════════════════════════════════
   MONTHLY AUDIT REPORT
   ══════════════════════════════════════════════════════════════════
   Built to the audit_admin.html design system, not to the field
   modules'. This page used to be a 520px phone column with the dark
   green module top bar — which is what every auditor screen looks
   like, and this is not one of them. It is opened from a desk, by an
   admin, to read four tables of up to a few hundred rows each and
   print them; squeezing that into a phone column meant every table
   scrolled sideways inside a 520px box on a 1920px screen.

   So: the admin palette (slate ground, white cards, 16px radii), the
   shared ribbon, and a content column that runs to 1400px. The tables
   get the width they were always asking for.

   The phone is not given up in return. Below 720px each table row
   folds into its own card, label on the left and value on the right,
   so an eight-column plot-condition row is read down instead of
   dragged sideways. Those rules are scoped to `screen` — print keeps
   real tables at every width.

   TWO THINGS ABOUT WHAT IT COVERS AND WHAT IT COUNTS, both the
   office's own asks and both written up where they live:

   - THE PERIOD IS A FROM DATE AND A TO DATE, not a month and a year.
     Both ends inclusive. See the filter markup.
   - A RECORD IS A VISIT, NOT A ROW, on Plot Condition and on
     Maintenance — the same plot on the same day whatever the batch,
     the same plot and task on the same day whatever the case. The
     batches and the cases are still each on their own line. See
     MOD_RECORD_KEY, and recordCount, which every figure on the page
     goes through.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Operation Reports' own palette (operation/operation_reports.html) —
     cream ground, brown ink, tan hairlines, olive accent — swapped in for
     this page's former slate/admin one so the two report screens read as
     one system. The module hues below are untouched: badges, summary
     figures and the two nursery headers are colour-coded by THOSE, not by
     the neutral tokens being replaced here. */
  --bg:#f8f4ec; --card:#fdfaf4; --line:#e8dcc8;
  --ink:#1a150d; --ink2:#3d2610; --ink3:#8a7a68;
  --green:#4a7a2e;
  --pn:#1a5c1a; --mn:#1565c0; --papan:#e65100; --maint:#880e4f; --batch:#5b3fa8;
  --r-md:12px; --r-lg:16px;
}
html,body{min-height:100%;font-family:'Outfit',system-ui,sans-serif;font-size:16px;
          background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{min-height:100vh;background:var(--bg)}

/* ── CONTENT ──
   1400 rather than the manage page's 1100: that page is a grid of cards
   and this one is tables, which have somewhere to put the extra width. */
.content{max-width:1400px;margin:0 auto;padding:22px 32px 3rem}
.section-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
              color:var(--ink3);padding-left:2px}

/* ── FILTERS ──
   Left accent bar + a bigger radius — Operation Reports' own glass-panel
   treatment (border-left:12px solid #6aa83c, rounded-[2rem]) on its filter
   card, ported here at a scale that still fits a plain border/box-shadow
   card rather than that page's backdrop-blur one. */
.filter-card{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--green);
             border-radius:1.75rem;padding:20px 22px 18px;box-shadow:0 1px 3px rgba(16,40,60,.05);
             margin-bottom:24px}
/* From/To narrow and fixed — a date box never needs a 210px-wide column —
   Nursery sized to exactly fit its four chips on one line (max-content,
   not 1fr, so it doesn't stretch or wrap), and Plot takes whatever's left
   over. All four in the one row on a desk; the 900px query below falls
   back to the old auto-fit wrap for anything narrower. */
.filter-grid{display:grid;grid-template-columns:150px 150px max-content minmax(180px,240px);gap:16px;align-items:end}
/* A date input draws its own picker glyph and will otherwise sit a
   hair taller than the text box beside it. */
.filter-grid input[type=date]{min-width:0}
@media (max-width:900px){
  .filter-grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
}
/* Second row: Modules to Include on the left, Generate Report on the
   right, bottoms aligned — one balanced row instead of a label row, a
   chip row and a button floating centred in white space below them.
   A hairline above separates "what to report on" from "what to include
   and go". On a phone the two stack and the button centres itself. */
.filter-actions{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
                flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.filter-actions .btn-generate{margin:0}
@media (max-width:900px){
  .filter-actions{flex-direction:column;align-items:stretch}
  .filter-actions .btn-generate{align-self:center}
}
.filter-label{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;
              letter-spacing:1px;margin-bottom:6px}
.select-wrap{position:relative}
.select-wrap::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);
                    border-left:5px solid transparent;border-right:5px solid transparent;
                    border-top:6px solid var(--ink3);pointer-events:none}
select.input{width:100%;height:44px;padding:0 34px 0 13px;font-size:13.5px;font-weight:600;
             font-family:inherit;border:1px solid var(--line);border-radius:var(--r-md);
             background:#f8fafc;color:var(--ink);outline:none;cursor:pointer;
             -webkit-appearance:none;appearance:none}
select.input:hover{background:#eef3f8}
select.input:focus{border-color:var(--green);background:var(--card);
                   box-shadow:0 0 0 3px rgba(74,122,46,.15)}
/* The Plot search box — same look as the selects above it, minus the
   dropdown-arrow bits that only make sense on a <select>. */
input.input{width:100%;height:44px;padding:0 13px;font-size:13.5px;font-weight:600;
            font-family:inherit;border:1px solid var(--line);border-radius:var(--r-md);
            background:#f8fafc;color:var(--ink);outline:none}
input.input::placeholder{color:var(--ink3);font-weight:600}
input.input:hover{background:#eef3f8}
input.input:focus{border-color:var(--green);background:var(--card);
                  box-shadow:0 0 0 3px rgba(74,122,46,.15)}

/* Tick chips — Month/Year stay plain selects, but Nursery (Pre-Nursery /
   BNN / UNN 1 / UNN 2) and Modules to Include are both multi-select-by-
   ticking now, in the one shared style: a real checkbox in a pill, same as
   the Locations chips on Operation Reports (operation_reports.html's own
   .nursery-chip) — not the old borderless colour-swap pill neither row
   used to be a checkbox at all. */
.tick-row{display:flex;flex-wrap:wrap;gap:8px}
.tick-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
           color:var(--ink2);cursor:pointer;background:#fff;border:1.5px solid var(--line);
           padding:8px 14px;border-radius:10px;transition:background .15s,border-color .15s;
           -webkit-tap-highlight-color:transparent;user-select:none}
.tick-chip:hover{background:#f5f0e4}
.tick-chip:has(input:checked){background:#e8f5da;border-color:var(--green)}
.tick-chip input{accent-color:var(--green)}

/* Same block as the manage page's "Visit 555 Auditor Portal" — this is the
   one thing to press on the card, and it should look like it. Sized to its
   own content and centred, not a full-width bar — the filter card already
   makes clear it's the only action on it. */
.btn-generate{display:flex;align-items:center;justify-content:center;gap:8px;width:fit-content;
              margin:18px auto 0;padding:10px 22px;border:none;border-radius:var(--r-md);
              background:linear-gradient(135deg,#6aa83c,#4a7a2e);color:#fff;font-family:inherit;
              font-weight:900;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
              cursor:pointer;box-shadow:0 8px 20px -4px rgba(74,122,46,.5);transition:all .15s}
.btn-generate:hover{transform:translateY(-1px);box-shadow:0 12px 24px -6px rgba(74,122,46,.55)}
.btn-generate:active{transform:translateY(1px)}
.btn-generate svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;
                  stroke-linecap:round;stroke-linejoin:round}

/* The filter card folds away once a report is on screen — on a phone it is
   two thirds of the first screenful and the report is the thing wanted. */
.collapse-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;
              cursor:pointer;font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.6px;
              text-transform:uppercase;color:var(--ink3)}
.collapse-btn:hover{color:var(--ink)}
.collapse-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;
                  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.filter-card.collapsed{display:none}
.is-collapsed .collapse-btn svg{transform:rotate(-90deg)}

/* ── TOOLBAR ──
   Print and full screen. The old page kept Print in a bar pinned to the
   bottom of the viewport at 520px wide, which on a desktop was a white
   strip across the middle of the screen. It belongs with the report. */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;
      background:var(--card);border:1px solid var(--line);color:var(--ink2);font-family:inherit;
      font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
      text-decoration:none;box-shadow:0 1px 3px rgba(16,40,60,.05);
      transition:background .15s,color .15s,border-color .15s}
.tbtn:hover{background:#ecfdf5;color:#059669;border-color:#a7f3d0}
.tbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;
          stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tbtn-primary{background:var(--pn);border-color:var(--pn);color:#fff}
.tbtn-primary:hover{background:#144a14;border-color:#144a14;color:#fff}

/* The height unit pair. Narrower than a .tbtn because the label is one or
   two characters, and the two sit tight together so they read as one
   control with two settings rather than as two more toolbar buttons. The
   ON one is filled -- a pair where neither is filled is a pair that does
   not say which unit the sheet is in. */
.tbtn-unit-bar{display:inline-flex;align-items:center;gap:6px}
.tbtn-unit-label{font-size:10.5px;font-weight:800;letter-spacing:.08em;
                 text-transform:uppercase;color:var(--ink3)}
.tbtn-unit{padding:0 14px;min-width:52px;justify-content:center;text-transform:none;
           letter-spacing:0;font-size:13px}
.tbtn-unit.is-on{background:var(--batch);border-color:var(--batch);color:#fff}
.tbtn-unit.is-on:hover{background:var(--batch);border-color:var(--batch);color:#fff}

/* ── REPORT HEADER (the letterhead) ──
   Just the title/period/generated line now — no MJM Nursery wordmark or
   company address. This report only ever opens inside the admin portal
   that already says whose system it is; the logo was wording a reader
   here doesn't need repeated back at them. */
.report-header{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
               padding:14px 20px;margin-bottom:14px;text-align:center;
               box-shadow:0 1px 3px rgba(16,40,60,.05)}
.report-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ink);
              line-height:1.2}
.report-period{font-size:13px;font-weight:700;color:var(--ink2);margin-top:5px}
.report-generated{font-size:10.5px;color:var(--ink3);margin-top:5px}

/* ── SUMMARY ──
   auto-fit again: five figures across on a desk, two across on a phone.
   132 rather than a rounder 150 because five is the real count — at 150
   the fifth card dropped onto a row of its own on a tablet, which reads
   as a sixth figure that failed to load rather than as a wrap. Cards
   shrunk down from a 32px-figure showpiece to a plain compact stat — five
   of them used to run to their own tall row before a single table row of
   real data appeared underneath. */
.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
             gap:8px;margin-bottom:14px}
.sum-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
          padding:8px 10px;text-align:center;box-shadow:0 1px 3px rgba(16,40,60,.05)}
.sum-val{font-size:19px;font-weight:900;color:var(--pn);line-height:1;font-variant-numeric:tabular-nums}
.sum-label{font-size:8.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;
           letter-spacing:.8px;margin-top:3px}

/* ── NURSERY SECTION ── */
.mod-section{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
             margin-bottom:16px;overflow:hidden;box-shadow:0 1px 3px rgba(16,40,60,.05)}
.mod-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mod-head-pn{background:linear-gradient(135deg,#2f9c4f,#1b6b32)}
.mod-head-mn{background:linear-gradient(135deg,#2f86d8,#12508f)}
/* Height by Batch is neither nursery -- it is one section about batches,
   so it gets a hue of its own rather than borrowing PN's. */
.mod-head-batch{background:linear-gradient(135deg,#7d5fd0,#4a3090)}
.mod-head-title{font-size:13px;font-weight:900;color:#fff;letter-spacing:.07em;text-transform:uppercase}
.mod-head-sub{font-size:11px;color:rgba(255,255,255,.72);margin-top:3px;font-weight:600}
.mod-head-badge{font-size:11px;font-weight:800;background:rgba(255,255,255,.22);color:#fff;
                padding:5px 13px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.mod-block{border-top:1px solid var(--line)}
.mod-block-head{padding:12px 20px;background:#f8fafc;display:flex;align-items:center;
                justify-content:space-between;gap:10px}
/* margin-right:auto rather than a third flex rule. The head is
   space-between, which with the name, the badge and the maintenance note
   would stand the badge in the MIDDLE of the row; an auto margin eats the
   free space instead, so the name stays left and the badge keeps its note
   beside it. With two children it changes nothing at all. */
.mod-block-name{font-size:11.5px;font-weight:900;color:var(--ink);letter-spacing:.05em;
                text-transform:uppercase;margin-right:auto}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
.rec-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rec-table th{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
              color:var(--ink3);padding:10px 14px;text-align:left;
              border-bottom:1px solid var(--line);background:var(--card);white-space:nowrap}
.rec-table td{padding:10px 14px;border-bottom:1px solid #f1f5f9;color:var(--ink);
              vertical-align:middle;white-space:nowrap}
.rec-table tbody tr:last-child td{border-bottom:none}
.rec-table tbody tr:hover td{background:#f8fafc}
.rec-table .num{font-variant-numeric:tabular-nums}
.rec-table .total-row td{background:#f8fafc;font-weight:800;color:var(--pn);
                         border-top:1px solid var(--line);font-size:11.5px;
                         letter-spacing:.04em;text-transform:uppercase}
.rec-table tbody tr.total-row:hover td{background:#f8fafc}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:4px 11px;border-radius:999px;
       white-space:nowrap;flex-shrink:0}
.badge-plot{background:#e8f5e9;color:var(--pn)}
.badge-height{background:#e0f2fe;color:#0369a1}
/* A cell that covers a whole run of rows sits in the middle of it, across
   and down, so it reads as belonging to the block rather than to its top
   line. Left-aligned it hangs off one edge of a tall empty box and looks
   like a stray figure; centred, the box reads as the block's own. */
.rec-table td.grp{vertical-align:middle;text-align:center;background:#fbfdff;
                  border-left:1px solid var(--line);font-size:14px;
                  font-variant-numeric:tabular-nums;color:var(--pn)}
.rec-table th.grp{text-align:center;border-left:1px solid var(--line)}
.badge-papan{background:#fff3e0;color:var(--papan)}
.badge-maint{background:#fce4ec;color:var(--maint)}
/* The admin tag on a Done By cell, and the note on the block head that
   says the table was narrowed. Both print: the note is the only thing on
   a printed sheet that says the month held more than is on it. */
.doneby-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:20px;
            background:#f1f5f9;color:#475569;font-size:10px;font-weight:700;
            text-transform:uppercase;letter-spacing:.4px;vertical-align:middle}
.mod-block-note{font-size:11px;font-weight:600;color:#b45309}
/* The case id is an IDENTIFIER and never a quantity, so it is set in the
   figures of a mono face and muted: somebody running down the column is
   asking whether two rows differ, not reading a number. It does not wrap --
   an id broken over two lines reads as two ids. */
.case-id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:11px;color:#64748b;white-space:nowrap;letter-spacing:-.2px}
.case-none{font-size:11px;color:#b45309;font-weight:600}
.badge-batch{background:#ede7fb;color:var(--batch)}
/* The four age figures, inside the section rather than up with the page's
   own summary: they are about these batches, not about the report. */
.age-row{padding:12px 14px 2px}
.sum-foot{font-size:9px;font-weight:700;color:var(--ink3);margin-top:3px}
.no-data{text-align:center;padding:26px 16px;color:var(--ink3);font-size:12.5px;font-weight:600}

/* ── STATES ── */
.empty-report{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
              text-align:center;padding:3.5rem 1.5rem;color:var(--ink3);font-size:13px;
              box-shadow:0 1px 3px rgba(16,40,60,.05)}
.empty-report svg{width:46px;height:46px;stroke:#cbd9e2;fill:none;stroke-width:1.3;
                  margin:0 auto 14px;display:block}
.empty-report strong{color:var(--ink2)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(8px);
       background:#0f2f1a;color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;
       font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;z-index:9999;
       transition:all .28s ease;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loading-overlay{position:fixed;inset:0;background:rgba(16,40,60,.45);z-index:9998;
                 display:flex;align-items:center;justify-content:center}
#loading-overlay.hidden{display:none!important}
.loading-box{background:#fff;border-radius:var(--r-lg);padding:26px 34px;display:flex;
             flex-direction:column;align-items:center;gap:13px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.loading-spinner{width:32px;height:32px;border:3px solid #e8f5e9;border-top-color:var(--pn);
                 border-radius:50%;animation:spin .7s linear infinite}
.loading-text{font-size:12.5px;font-weight:700;color:var(--ink2)}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

/* ── FULL SCREEN ──
   Two things at once, because the browser gives only one of them. The
   Fullscreen API takes the report out to the edges of the display, which
   is what somebody presenting a month's figures wants; and the same class
   is applied whether or not the API answers, so a browser that refuses
   (an iPhone does) still gets the report filling the tab with everything
   else out of the way. Nothing here is the report itself, so nothing here
   is worth a pixel in that mode. */
body.is-full .fcr,
body.is-full .filter-section,
body.is-full .report-section-head,
body.is-full #nelos-dock,
body.is-full .nelos-dock{display:none!important}
body.is-full .content{max-width:none;padding:14px 18px 40px}
body.is-full{background:var(--card)}
body.is-full #app{background:var(--card)}
body.is-full .report-header{border:none;box-shadow:none;padding-top:8px}
/* The way back out has to stay reachable, and in full screen the toolbar
   has scrolled off long before anybody wants it. It replaces the
   toolbar's own Full Screen button rather than joining it — two Exit
   buttons on one screen is one too many. */
.exit-full{display:none;position:fixed;top:14px;right:14px;z-index:300}
body.is-full .exit-full{display:inline-flex}
body.is-full #btn-full{display:none}

/* ── PHONE: rows become cards ──
   `screen` only. A phone printing this still prints tables. */
@media screen and (max-width:720px){
  .tbl-wrap{overflow-x:visible}
  /* The header row is dropped from view but kept for screen readers —
     each cell carries its own label in ::before instead. */
  .rec-table thead{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;
                   clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .rec-table,.rec-table tbody,.rec-table tr,.rec-table td{display:block;width:100%}
  .rec-table tbody tr{border:1px solid var(--line);border-radius:var(--r-md);
                      margin:0 0 8px;overflow:hidden;background:var(--card)}
  .rec-table tbody tr:last-child{margin-bottom:0}
  .rec-table td{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
                padding:9px 13px;border-bottom:1px solid #f1f5f9;text-align:right;
                white-space:normal}
  .rec-table tbody tr td:last-child{border-bottom:none}
  .rec-table td::before{content:attr(data-label);flex-shrink:0;font-size:9.5px;font-weight:800;
                        letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);
                        text-align:left}
  .rec-table tbody tr:hover td{background:transparent}
  /* A card row is a label on the left and its answer on the right; the
     centring the table wants would put this one in neither place. */
  .rec-table td.grp{text-align:right;border-left:none;font-size:inherit}
  /* A CARD THAT CONTINUES THE ONE ABOVE IT SAYS SO.
     A record is drawn as one block with its plot and its day merged down
     the side -- which a table does with a rowspan and a stack of cards
     cannot do at all, so these cards would otherwise open on a batch with
     nothing saying which plot it is in. Indented, and headed with what it
     is a continuation of. */
  .rec-table tbody tr.rec-cont{margin-left:14px;border-left:3px solid var(--green)}
  .rec-table tbody tr.rec-cont::before{content:attr(data-cont);display:block;
                      padding:6px 13px;font-size:9.5px;font-weight:800;letter-spacing:.7px;
                      text-transform:uppercase;color:var(--ink3);background:#f8fafc;
                      border-bottom:1px solid #f1f5f9}
  /* and its first cell is a batch, not a record number, so it must not
     take the card-header treatment the rule below gives one. */
  .rec-table tbody tr.rec-cont td:first-child{background:transparent;font-weight:inherit}
  /* The first cell becomes the card's header rather than just another
     row: without it a card of eight identical grey-label rows gives no
     answer to "where does one record stop and the next begin". */
  .rec-table tbody tr td:first-child{background:#f8fafc;font-weight:800;
                                     border-bottom:1px solid var(--line)}
  .rec-table tbody tr.total-row{border-color:var(--line);background:#f8fafc}
  .rec-table .total-row td{justify-content:center;border:none;text-align:center;padding:11px 13px}
  .rec-table .total-row td::before{display:none}
  .mod-block-body{padding:10px}
  .mod-block-body .no-data{padding:16px}
}

@media (max-width:640px){
  .content{padding:16px 14px 3rem}
  .report-title{font-size:19px}
  .mod-head{padding:14px 15px}
  .filter-card{padding:15px}
  .tbtn{flex:1;justify-content:center;padding:0 12px}
  /* The pair takes a row of its own rather than being squeezed in beside
     three buttons that have each just been told to take an equal share. */
  .tbtn-unit-bar{flex:1 0 100%;justify-content:center}
  .tbtn-unit{flex:0 0 auto}
}

/* ── PRINT ──
   Everything that is chrome comes off; the tables come back to being
   tables at any width, and the two nursery headers keep their colour so a
   printed report is still readable as two nurseries. */
@media print{
  @page{margin:12mm;size:A4}
  html,body{background:#fff;font-size:10pt}
  #app{background:#fff}
  .fcr,.filter-section,.toolbar,.report-section-head,.toast,#loading-overlay,
  .exit-full,#nelos-dock,.nelos-dock{display:none!important}
  .content{max-width:100%;padding:0}
  .report-header,.sum-card,.mod-section{box-shadow:none;border:1px solid #d7e0e8}
  .mod-section{break-inside:avoid;page-break-inside:avoid}
  .summary-row{grid-template-columns:repeat(5,1fr)}
  .tbl-wrap{overflow:visible}
  .rec-table,.rec-table tbody,.rec-table tr,.rec-table td{display:revert;width:auto}
  .rec-table{display:table;width:100%}
  .rec-table thead{display:table-header-group;position:static;width:auto;height:auto;clip:auto}
  .rec-table tr{display:table-row;border:none;margin:0}
  .rec-table td{display:table-cell;text-align:left;border-bottom:1px solid #eef2f4}
  .rec-table td::before{display:none}
  .rec-table tr{break-inside:avoid;page-break-inside:avoid}
  .mod-head-pn{background:#1b6b32!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .mod-head-mn{background:#12508f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .mod-head-batch{background:#4a3090!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .mod-block-head,.rec-table .total-row td{background:#f5f8fa!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

            <div class="tick-row" id="f-nursery-chips">

            <div class="filter-label">Plot</div>

              <label class="tick-chip"><input type="checkbox" class="mod-cb" onchange="toggleMod(this,'height')">📏 Seedling Height</label>
              <label class="tick-chip"><input type="checkbox" class="mod-cb" onchange="toggleMod(this,'papan')">🪧 Papan Tanda</label>
              <label class="tick-chip"><input type="checkbox" class="mod-cb" onchange="toggleMod(this,'maint')">🔧 Maintenance</label>

              <label class="tick-chip"><input type="checkbox" class="mod-cb" onchange="toggleMod(this,'bheight')">📦 Height by Batch</label>
            </div>
          </div>

          <!-- MAINTENANCE IS THE ONE MODULE WHOSE TABLE HOLDS TWO
               DIFFERENT ACTS. An auditor walks the plot and answers
               Satisfied or Unsatisfied; an ADMIN closes a cold task from

               asked to be able to tell them apart: "we want to filter to

               BOTH START TICKED, which is exactly what the report has

               unticks one. That is the opposite of the Nursery and Module

          <div id="f-doneby-row" style="display:none">
