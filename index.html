<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>MJM Nursery Audit has moved</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#1a4d1a;color:#fff;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px}
  .box{max-width:340px}
  h1{font-size:19px;font-weight:700;margin:0 0 10px}
  p{font-size:14px;line-height:1.6;opacity:.85;margin:0 0 22px}
  a{display:inline-block;background:#fff;color:#1a4d1a;text-decoration:none;font-weight:700;
    font-size:15px;padding:13px 26px;border-radius:10px}
  .spin{width:26px;height:26px;margin:0 auto 18px;border:3px solid rgba(255,255,255,.25);
        border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>The audit app has moved</h1>
    <p>It now lives inside the MJM Nursery portal. Taking you there&nbsp;&mdash; please update your bookmark.</p>
    <a id="go" href="https://ai.mjmnursery.com/audit/audit_home.html">Open MJM Nursery Audit</a>
  </div>

<script>
/* This repository is retired; the audit app is part of the portal now.
   Phones that installed the old PWA are still holding a service worker and a
   full offline cache of it, so tear those down before leaving — otherwise the
   cache keeps serving the old app and this page is never seen again. */
var TARGET = 'https://ai.mjmnursery.com/audit/audit_home.html';
document.getElementById('go').href = TARGET;

function teardown() {
  var jobs = [];
  if (window.caches && caches.keys) {
    jobs.push(caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }).catch(function () {}));
  }
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.map(function (r) { return r.unregister(); }));
    }).catch(function () {}));
  }
  return Promise.all(jobs);
}

/* Never let the teardown strand anyone: leave after 2s whatever happens. */
var left = false;
function leave() { if (!left) { left = true; window.location.replace(TARGET); } }
setTimeout(leave, 2000);
teardown().then(leave);
</script>
</body>
</html>
